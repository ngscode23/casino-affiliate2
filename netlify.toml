# netlify.toml

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_PNPM = "true"
  PNPM_VERSION = "10.15.1"

[context.production.environment]
  VITE_FEATURE_AGE_GATE = "true"
  GO_CLICK_RATELIMIT_MS = "30000"

[context.deploy-preview.environment]
  VITE_FEATURE_AGE_GATE = "true"
  GO_CLICK_RATELIMIT_MS = "30000"

# Serverless-функции до SPA-фоллбэка
[[redirects]]
  from = "/go/*"
  to = "/.netlify/functions/go/:splat"
  status = 200
  force = true

# SPA fallback (последним)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Общие заголовки (однострочная CSP!)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; script-src-elem 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-attr 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://stats.g.doubleclick.net; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://*.supabase.co wss://*.supabase.co; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Кэш для статических ассетов
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML не кэшируем
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[context.development]
  [[context.development.headers]]
    for = "/*"
    [context.development.headers.values]
      Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8888 https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:;"

[dev]
  command = "npm run dev"     # run Vite dev server
  targetPort = 5173            # Vite dev port
  port = 8888                  # Netlify Dev main port (functions live here)
  framework = "#custom"        # prevent auto-detection issues
