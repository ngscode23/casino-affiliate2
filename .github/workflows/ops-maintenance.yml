name: Maintenance Jobs

on:
  schedule:
    # Dropship: refresh supplier feed every 15 minutes
    - cron: "*/15 * * * *"
    # Dropship: send queued emails every 5 minutes
    - cron: "*/5 * * * *"
    # Cleanup clicks daily at 03:00 UTC
    - cron: "0 3 * * *"
    # Cleanup recent views daily at 03:30 UTC
    - cron: "30 3 * * *"
    # Refresh analytics MVs daily at 04:00 UTC (adjust as needed)
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  dropship-supplier-feed:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run supplier feed cron
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/admin/supplier-feed/cron"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

  dropship-email-outbox:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Process email outbox
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/admin/email-outbox/process"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

  cleanup-clicks:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup-clicks RPC endpoint
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            "$BASE_URL/api/admin/maintenance/cleanup-clicks"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

  cleanup-recent-views:
    if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup-recent-views RPC endpoint
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            "$BASE_URL/api/admin/maintenance/cleanup-recent-views"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

  refresh-analytics:
    if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh of analytics materialized views
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            "$BASE_URL/api/admin/analytics/refresh"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
