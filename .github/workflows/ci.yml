name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: E2E (redirect) - optional
        if: env.PREVIEW_URL != ''
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          pnpm exec playwright install --with-deps || true
          pnpm run test:e2e || echo "E2E failed (non-blocking)"
