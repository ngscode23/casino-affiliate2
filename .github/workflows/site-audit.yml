name: Site Audit

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

env:
  # При необходимости замени на Deploy Preview URL
  SITE_URL: https://lucky-macaron-c3c96c.netlify.app

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]



    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.SITE_URL }}/
            ${{ env.SITE_URL }}/offers
            ${{ env.SITE_URL }}/offers/lucky-star
            ${{ env.SITE_URL }}/compare
          # если файла нет, либо добавь .lighthouserc.json, либо убери строку configPath
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LHCI_COLLECT__SETTINGS__EMULATED_FORM_FACTOR: ${{ matrix.form_factor }}
          LHCI_COLLECT__SETTINGS__FORM_FACTOR: ${{ matrix.form_factor }}

      - name: Summarize Lighthouse scores
        id: summarize
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Соберем краткую сводку по всем *.report.json
          summary=""
          shopt -s nullglob
          files=(**/*.report.json)
          if [ ${#files[@]} -eq 0 ]; then
            summary="Отчеты Lighthouse не найдены (JSON). Проверь uploadArtifacts/пути."
          else
            for f in "${files[@]}"; do
              url=$(jq -r '.finalUrl // empty' "$f")
              perf=$(jq -r '.categories.performance.score // empty' "$f")
              acc=$(jq -r '.categories.accessibility.score // empty' "$f")
              bp=$(jq -r '.categories["best-practices"].score // empty' "$f")
              seo=$(jq -r '.categories.seo.score // empty' "$f")
              [ -z "$url" ] && url="$f"
              printf -v line "%s\n  Performance: %s\n  Accessibility: %s\n  Best Practices: %s\n  SEO: %s\n\n" \
                "$url" "$perf" "$acc" "$bp" "$seo"
              summary+="$line"
            done
          fi
          {
            echo "body<<'EOF'"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment PR with Lighthouse summary
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Lighthouse summary (${{ matrix.form_factor }})**
            ```
            ${{ steps.summarize.outputs.body }}
            ```
            Отчеты (HTML/JSON) приложены как artifacts в job "Lighthouse (${{ matrix.form_factor }})".

  validators:
    name: Validators
    runs-on: ubuntu-latest
    steps:
      - name: SecurityHeaders grade
        id: sh
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL:-https://lucky-macaron-c3c96c.netlify.app}"
          ENC_URL=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SITE_URL'], safe=''))")
          HTML=$(curl -s "https://securityheaders.com/?q=${ENC_URL}&hide=on&followRedirects=on" || true)
          GRADE=$(printf "%s" "$HTML" | grep -oE "grade [A-F]" | awk '{print $2}' | head -n1 || true)
          echo "grade=${GRADE:-unknown}" >> "$GITHUB_OUTPUT"

      - name: W3C HTML Validator
        id: w3c
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL:-https://lucky-macaron-c3c96c.netlify.app}"
          urls=("$SITE_URL/" "$SITE_URL/offers" "$SITE_URL/offers/lucky-star" "$SITE_URL/compare")
          ERR_SUMMARY=""
          for u in "${urls[@]}"; do
            ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$u', safe=''))")
            API="https://validator.w3.org/nu/?doc=${ENC}&out=json"
            JSON=$(curl -s -H 'User-Agent: Mozilla/5.0' -H 'Accept: application/json' "$API" || true)
            if command -v jq >/dev/null 2>&1; then
              ERRS=$(printf '%s' "$JSON" | jq '[.messages[]? | select(.type=="error")] | length' 2>/dev/null || echo 0)
            else
              ERRS=0
            fi
            ERR_SUMMARY+="$u: ${ERRS} errors\n"
          done
          {
            echo "summary<<'EOF'"
            printf "%s" "$ERR_SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post summary comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Site validators**
            - SecurityHeaders.com grade: `${{ steps.sh.outputs.grade }}`
            - W3C HTML Validator errors per URL:
            ```
            ${{ steps.w3c.outputs.summary }}
            ```

            **Rich Results Test (manual)**
            - Home: https://validator.schema.org/#url=${{ env.SITE_URL }}/
            - Offers: https://validator.schema.org/#url=${{ env.SITE_URL }}/offers
            - Offer: https://validator.schema.org/#url=${{ env.SITE_URL }}/offers/lucky-star
            - Compare: https://validator.schema.org/#url=${{ env.SITE_URL }}/compare